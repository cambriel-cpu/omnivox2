[project]
name = "omnivox-evaluation"
version = "0.1.0"
description = "Hardware-independent evaluation harness for Omni Vox 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omnivox-gateway",
    "omnivox-protocol",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
omnivox-gateway = { workspace = true }
omnivox-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnivox_evaluation"]
